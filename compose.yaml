services:
  postgres:
    image: postgres:15
    container_name: postgres-db-friendship
    restart: always
    environment:
      - 'POSTGRES_DB=myfriendship'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myfriend'
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: redis-friendship
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1